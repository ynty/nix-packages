name: Build Nix Packages

# Controls when the workflow will run.
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch.
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.package }} on ${{ matrix.platform.name }}

    runs-on: ${{ matrix.platform.runner }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations.
      # Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        package:
          - herdr
          - pi-agent

        platform:
          - name: x86_64-linux
            runner: ubuntu-24.04
            nixpkgs: nixos-26.05
          - name: aarch64-linux
            runner: ubuntu-24.04-arm
            nixpkgs: nixos-26.05
          - name: aarch64-darwin
            runner: macos-latest
            nixpkgs: nixpkgs-26.05-darwin
        # include:
        # exclude:

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:${{ matrix.platform.nixpkgs }}

      - uses: cachix/cachix-action@v17
        with:
          name: '${{ secrets.CACHIX_CACHE_NAME }}'
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true

      - name: Build Package
        shell: bash
        run: >
          nix build .#${{ matrix.package }}
          --print-build-logs --show-trace
          --log-format raw
          --option log-lines 1000

      - name: Push to Cachix
        shell: bash
        run: |
          nix-shell -p bash --run '
            paths_output=$(nix path-info --recursive ./result) || exit 1
            printf '%s\n' "$paths_output"
            mapfile -t paths <<< "$paths_output"
            cachix push ${{ secrets.CACHIX_CACHE_NAME }} "${paths[@]}"
          '
